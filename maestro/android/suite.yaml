# Phone tests for Signer Dev, run by `npm run test:android`.
# Only what a real phone can show: Playwright covers everything else (npm run check).
# Rules: select by id only (real HTML ids in the app), no "if visible" steps, so a
# missing element fails the run instead of being skipped.
appId: ${APP_ID}
---
- runFlow: flows/01-open-sample.yaml
- runFlow: flows/02-sign-save-share.yaml
- runFlow: flows/03-arabic.yaml
- runFlow: flows/04-back-closes-saved-sheet.yaml

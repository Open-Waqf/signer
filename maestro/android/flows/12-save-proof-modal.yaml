appId: org.openwaqf.signer
---
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btn-sign-mode"
    commands:
      - tapOn:
          id: "btn-sign-mode"
- runFlow:
    when:
      visible:
        id: "btn-sample"
    commands:
      - tapOn:
          id: "btn-sample"
- runFlow:
    when:
      visible: "No file? Try with a sample PDF"
    commands:
      - tapOn: "No file? Try with a sample PDF"
- runFlow:
    when:
      visible: "ليس لديك ملف؟ جرب نموذج PDF"
    commands:
      - tapOn: "ليس لديك ملف؟ جرب نموذج PDF"
- runFlow:
    when:
      visible: "Pas de fichier ? Essayez avec un PDF d'exemple"
    commands:
      - tapOn: "Pas de fichier ? Essayez avec un PDF d'exemple"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btn-add-date"
    commands:
      - tapOn:
          id: "btn-add-date"
- runFlow:
    when:
      visible:
        id: "m-btn-add-date"
    commands:
      - tapOn:
          id: "m-btn-add-date"
- runFlow:
    when:
      visible: "+ Date"
    commands:
      - tapOn: "+ Date"
- waitForAnimationToEnd
- tapOn:
    id: "btn-save"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "hardware-prompt-modal"
    commands:
      - tapOn:
          id: "btn-hw-no"
- waitForAnimationToEnd
- assertVisible:
    id: "proof-modal"
- assertVisible:
    id: "saved-doc-id"
- assertVisible:
    id: "saved-doc-hash"
- assertVisible:
    id: "saved-handover-code"
- tapOn:
    id: "btn-copy-hash"
- tapOn:
    id: "btn-close-proof"
- waitForAnimationToEnd
- assertVisible:
    id: "btn-exit"
- tapOn:
    id: "btn-exit"
- waitForAnimationToEnd

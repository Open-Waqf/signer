# Switching the language to Arabic through the real Android picker.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil: # the first start after an install can take a few seconds
    visible:
      id: "btn-sample"
    timeout: 20000
- tapOn:
    id: "select-lang-home"
- tapOn: "العربية"
- assertVisible: "اختر ملف PDF"

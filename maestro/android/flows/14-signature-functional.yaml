appId: org.openwaqf.signer
---
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btn-sample"
    commands:
      - tapOn:
          id: "btn-sample"
- runFlow:
    when:
      visible: "No file? Try with a sample PDF"
    commands:
      - tapOn: "No file? Try with a sample PDF"
- runFlow:
    when:
      visible: "ليس لديك ملف؟ جرب نموذج PDF"
    commands:
      - tapOn: "ليس لديك ملف؟ جرب نموذج PDF"
- runFlow:
    when:
      visible: "Pas de fichier ? Essayez avec un PDF d'exemple"
    commands:
      - tapOn: "Pas de fichier ? Essayez avec un PDF d'exemple"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btn-add-sig"
    commands:
      - tapOn:
          id: "btn-add-sig"
- runFlow:
    when:
      visible:
        id: "m-btn-add-sig"
    commands:
      - tapOn:
          id: "m-btn-add-sig"
- waitForAnimationToEnd
- assertVisible:
    id: "signature-pad"
- swipe:
    from:
      id: "signature-pad"
    direction: RIGHT
    duration: 700
- swipe:
    from:
      id: "signature-pad"
    direction: LEFT
    duration: 700
- tapOn:
    id: "btn-save-sig"
- waitForAnimationToEnd
- assertVisible:
    id: "btn-save"
- tapOn:
    id: "btn-save"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "hardware-prompt-modal"
    commands:
      - tapOn:
          id: "btn-hw-no"
- waitForAnimationToEnd
- assertVisible:
    id: "proof-modal"
- assertVisible:
    id: "saved-doc-id"
- assertVisible:
    id: "saved-doc-hash"
- assertVisible:
    id: "saved-handover-code"
- tapOn:
    id: "btn-close-proof"
- waitForAnimationToEnd
- tapOn:
    id: "btn-exit"
- waitForAnimationToEnd

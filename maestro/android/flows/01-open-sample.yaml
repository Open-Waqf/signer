# The app starts, opens the sample PDF in the editor, and goes back home.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil: # the first start after an install can take a few seconds
    visible:
      id: "btn-sample"
    timeout: 20000
- tapOn:
    id: "btn-sample"
- assertVisible:
    id: "m-btn-add-date"
- assertVisible:
    id: "m-btn-finish"
- tapOn:
    id: "btn-exit"
- assertVisible:
    id: "btn-sample"

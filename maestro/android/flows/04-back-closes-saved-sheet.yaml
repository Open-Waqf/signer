# Back with the Saved sheet open closes the sheet and stays in the editor (bug O1).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    id: "btn-sample"
- tapOn:
    id: "m-btn-add-date"
- tapOn:
    id: "m-btn-finish"
- assertVisible:
    id: "btn-share-saved"
- pressKey: back
- assertNotVisible:
    id: "btn-share-saved"
- assertVisible:
    id: "m-btn-finish"

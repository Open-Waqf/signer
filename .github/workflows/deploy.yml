name: Deploy Open Waqf Signer

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_TSA_RELAY_URL: https://tsa.open-waqf.org/api/tsa
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Check Translations (i18n)
        run: npm run check-i18n

      # 🛑 SAFETY CHECK START 🛑
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Safety Tests (E2E)
        run: npx playwright test
      # 🛑 SAFETY CHECK END 🛑

      - name: Build Production
        # This only runs if tests passed!
        run: npm run build

      - name: Copy CNAME
        run: echo "sign.open-waqf.org" > dist/CNAME

      - name: Deploy to Deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: deploy
          clean: true
          git-config-name: "Open Waqf Bot"
          git-config-email: "bot@open-waqf.org"
          commit-message: "deploy: update signer (automated)"
